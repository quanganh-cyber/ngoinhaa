html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f5;font-family:'Nunito',system-ui,sans-serif;color:var(--tx)}

#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:10px;max-width:92vw;display:none;text-align:center}
#panel b{display:block;margin-bottom:6px;font-size:14px}
#panel div{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bub{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:#4a3b32;padding:6px 11px;border-radius:14px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
#hint{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.75;max-width:45vw}

 const hd=new T.Group();hd.position.y=1.5;g.add(hd);
 Sp(hd,0,0,0,.36,SK);Sp(hd,0,.07,-.06,.385,d.h);
 [-.13,.13].forEach(x=>{Sp(hd,x,-.02,.33,.045,'#222');Sp(hd,x*1.7,-.12,.3,.06,'#ffb3b3')});
 if(d.gl)[-.13,.13].forEach(x=>{const t=new T.Mesh(new T.TorusGeometry(.085,.015,6,12),M('#333'));t.position.set(x,-.02,.35);hd.add(t)});
 if(d.bun)Sp(hd,0,.4,-.1,.15,d.h);
 if(d.pig)[-.4,.4].forEach(x=>Sp(hd,x,-.05,-.05,.13,d.h));
 g.scale.setScalar(d.s);
 g.traverse(o=>{if(o.isMesh)o.userData.i=i});
 scene.add(g);
 const el=document.createElement('div');el.className='bub';document.body.appendChild(el);
 return{i,d,g,L,R:Rr,AL,AR,hd,book,can,el,path:[],act:'tv',ph:0,fl:0,sit:0,wait:15+Math.random()*25,bt:0};
}
const chs=DEF.map(mkChar);
const ys=(c,s)=>FY[s.fl]+(s.s?s.s-.55*c.d.s:0);
function arrive(c,k,quiet){const s=S[k];c.k=k;c.act=s.a;c.fl=s.fl;c.sit=!!s.s;c.g.position.set(s.x,ys(c,s),s.z);c.g.rotation.y=s.f;
 if(!quiet)say(c,s.l[Math.random()*2|0]);c.wait=18+Math.random()*25}
chs.forEach((c,i)=>arrive(c,c.d.home,true));
function say(c,t){c.el.textContent=t;c.el.style.opacity=1;c.bt=4.5}
function go(c,k){
 const s=S[k];if(c.k===k&&!c.path.length)return;
 const cz=f=>f?.8:3.8,pts=[],P=(x,y,z)=>pts.push(new V3(x,y,z));
 const V3=V;let f=c.fl;const p=c.g.position;
 P(p.x,FY[f],p.z);P(p.x,FY[f],cz(f));
 if(f!==s.fl){
  if(f==0){P(9.9,0.05,3.8);P(9.9,.05,2.5);P(6,3.25,2.5);P(5.5,3.25,2.5);P(5.5,3.25,.8)}
  else{P(5.5,3.25,.8);P(5.5,3.25,2.5);P(6,3.25,2.5);P(9.9,.05,2.5);P(9.9,.05,3.8)}
  f=s.fl}
 P(s.x,FY[f],cz(f));P(s.x,FY[f],s.z);
 c.path=pts.slice(1);c.g.position.y=FY[c.fl];c.act='walk';c.k=k;c.target=k;c.sit=false;c.el.style.opacity=0;c.bt=0;
 // cập nhật tầng khi đi qua cầu thang
}

/* ---------- Âm thanh (tạo bằng Web Audio, không cần file nhạc) ---------- */
let AC,musG,ambG,NB,szG,mus=false,amb=false,night=false,nT=0,nn=0;
const CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],mf=m=>440*2**((m-69)/12);
function initA(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();
 musG=AC.createGain();ambG=AC.createGain();musG.gain.value=0;ambG.gain.value=0;musG.connect(AC.destination);ambG.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=3500;
 szG=AC.createGain();szG.gain.value=0;s.connect(hp);hp.connect(szG);szG.connect(ambG);s.start();
 setInterval(sched,150);bird()}
function tone(f,t,d,v,ty,lp){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=ty;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=lp;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);g.connect(musG);o.start(t);o.stop(t+d+.05)}
function hit(t,d,v,hp,dest,lp){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=lp?'lowpass':'highpass';f.frequency.value=hp;
 const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random());s.stop(t+d)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
 g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(musG);o.start(t);o.stop(t+.25)}
function sched(){if(!mus||!AC)return;const sd=60/72/2;if(nT<AC.currentTime)nT=AC.currentTime+.05;
 while(nT<AC.currentTime+.4){const st=nn%8,ch=CH[(nn>>3)%4];
  if(st==0){ch.forEach(m=>tone(mf(m),nT,sd*7,.07,'triangle',900));tone(mf(ch[0]-24),nT,sd*3,.14,'sine',400)}
  if(st==0||st==5)kick(nT);if(st%2)hit(nT,.06,.05,7000,musG);if(st==4)hit(nT,.12,.08,1500,musG);
  if(Math.random()<.35)tone(mf(ch[Math.random()*4|0]+12),nT,sd*2,.05,'sine',2200);
  hit(nT,.03,.01,3000,musG);nT+=sd;nn++}}
function step(){if(!amb||!AC)return;hit(AC.currentTime,.07,.05,500,ambG,1)}
function bird(){if(AC&&amb&&!night){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(2200+Math.random()*1500,t);
 o.frequency.exponentialRampToValueAtTime(3500,t+.08);o.frequency.exponentialRampToValueAtTime(2400,t+.18);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
 o.connect(g);g.connect(ambG);o.start(t);o.stop(t+.25)}setTimeout(bird,1500+Math.random()*4000)}
const tg=(b,on)=>b.classList.toggle('on',on);
$('bm').onclick=()=>{initA();AC.resume();mus=!mus;tg($('bm'),mus);musG.gain.setTargetAtTime(mus?.9:0,AC.currentTime,.3)};
$('ba').onclick=()=>{initA();AC.resume();amb=!amb;tg($('ba'),amb);ambG.gain.setTargetAtTime(amb?1:0,AC.currentTime,.3)};

/* ---------- Ngày / Đêm ---------- */
function setNight(n){night=n;const bg=n?'#141a3a':'#bfe3f5';scene.background=new T.Color(bg);scene.fog=new T.Fog(bg,70,160);document.body.style.background=bg;
 hemi.intensity=n?.28:.9;sun.intensity=n?.35:1;sun.color.set(n?'#8fa8ff':'#fff0cc');hemi.color.set(n?'#6070b0':'#fff6e8');
 rl.forEach(l=>l.intensity=n?.9:0);lamps.forEach(l=>l.intensity=n?1.2:0);lampM.emissiveIntensity=n?1.5:.2;
 WM.color.set(n?'#ffd98a':'#bfe6ff');WM.emissive.set(n?'#ffcf6a':'#bfe6ff');WM.emissiveIntensity=n?1:.5;
 stars.visible=moon.visible=n;sunM.visible=!n;clouds.forEach(c=>c.visible=!n);
 $('bn').textContent=n?'☀️ Ngày':'🌙 Đêm';tg($('bn'),n)}
$('bn').onclick=()=>setNight(!night);$('br').onclick=resetCam;setNight(false);

/* ---------- Chọn nhân vật ---------- */
const ring=new T.Mesh(new T.RingGeometry(.5,.65,32),new T.MeshBasicMaterial({color:'#ffd23f',side:T.DoubleSide,transparent:true,opacity:.9}));
ring.rotation.x=-Math.PI/2;ring.visible=false;scene.add(ring);
let sel=null;const panel=$('panel');
function select(c){sel=c;ring.visible=!!c;if(!c){panel.style.display='none';return}
 panel.innerHTML='<b>'+c.d.n+' muốn đi đâu?</b><div></div>';const dv=panel.lastChild;
 DEST.forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.onclick=e=>{e.stopPropagation();go(c,k);panel.style.display='none'};dv.appendChild(b)});
 panel.style.display='block';say(c,['Mình ở đây nè! 👋','Hihi, gọi mình hả?','Đi chơi thôi nào!'][Math.random()*3|0])}
const ray=new T.Raycaster(),mp=new T.Vector2();let down=null;
R.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
 mp.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mp,cam);
 const h=ray.intersectObjects(chs.map(c=>c.g),true)[0];select(h?chs[h.object.userData.i]:null)});

/* ---------- Hoạt họa ---------- */
const ck=new T.Clock(),ARMS={tv:[-.25,-.25],cook:0,eat:0,read:[-1.3,-1.3],type:0,game:0,toy:0,water:[-.15,-1.2],chess:0,brush:0,walk:0};
function pose(c,t,dt){
 const a=c.act;let ll=0,lr=0,al=0,ar=0,hx=Math.sin(t*2+c.i)*.03,sw=0;
 if(a=='walk'){c.ph+=dt*9;const w=Math.sin(c.ph);ll=w*.7;lr=-w*.7;al=-w*.6;ar=w*.6;hx=0;
  if(Math.sign(Math.cos(c.ph))!=c.lastS){c.lastS=Math.sign(Math.cos(c.ph));step()}}
 else{if(c.sit)ll=lr=-1.45;
  if(a=='tv'){al=ar=-.25}
  else if(a=='cook'){al=-1+Math.sin(t*5)*.3;ar=-1+Math.cos(t*5)*.3;hx=.2}
  else if(a=='eat'){ar=-1.5+Math.abs(Math.sin(t*2))*.8;al=-.4;hx=.1}
  else if(a=='brush'){ar=-2.2+Math.sin(t*9)*.25;al=-.1}
  else if(a=='game'||a=='type'){al=ar=-1.15+Math.sin(t*14+c.i)*.08;hx=.15}
  else if(a=='chess'){ar=-1.1+Math.sin(t*1.2)*.5;al=-.3;hx=.2}
  else if(a=='read'){al=ar=-1.3;hx=.4}
  else if(a=='toy'){al=-1.5+Math.sin(t*3)*.6;ar=-1.5+Math.sin(t*3+2)*.6}
  else if(a=='water'){ar=-1.2;al=-.15;hx=.2}
  else if(a=='swing'){ll=Math.sin(t*1.4+.5)*.5-.1;lr=ll;al=ar=-.3;sw=1}}
 c.L.rotation.x=ll;c.R.rotation.x=lr;c.AL.rotation.x=al;c.AR.rotation.x=ar;c.hd.rotation.x=hx;
 c.book.visible=a=='read';c.can.visible=a=='water';
 if(sw){const an=Math.sin(t*1.4)*.3;sw0=an;const s=c.d.s;c.g.position.set(4,2.4-1.8*Math.cos(an)-.55*s,8-1.8*Math.sin(an))}
}
let sw0=0;
const q=new V(),pr=new V();
function frame(){requestAnimationFrame(frame);const dt=Math.min(ck.getDelta(),.1),t=ck.elapsedTime;
 let cooking=false,swing=false;
 chs.forEach(c=>{
  if(c.path.length){const p=c.g.position,n=c.path[0];q.subVectors(n,p);const d=q.length(),st=2.3*dt;
   if(d<=st){p.copy(n);c.path.shift();if(!c.path.length)arrive(c,c.target)}
   else{q.multiplyScalar(st/d);p.add(q);
    const dx=n.x-p.x,dz=n.z-p.z;if(Math.hypot(dx,dz)>.01){let df=Math.atan2(dx,dz)-c.g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));c.g.rotation.y+=df*Math.min(1,dt*10)}
    c.fl=p.y>1.6?1:0}}
  else{c.wait-=dt;if(c.wait<=0&&sel!==c){const ks=Object.keys(S);go(c,ks[Math.random()*ks.length|0])}}
  if(c.act=='cook')cooking=true;if(c.act=='swing')swing=true;
  pose(c,t,dt);
  if(c.bt>0){c.bt-=dt;if(c.bt<=0)c.el.style.opacity=0}
  c.hd.getWorldPosition(pr);pr.y+=.55*c.d.s;pr.project(cam);
  c.el.style.left=(pr.x*.5+.5)*innerWidth+'px';c.el.style.top=(-pr.y*.5+.5)*innerHeight+'px';
  if(pr.z>1)c.el.style.opacity=0});
 sw.rotation.x=swing?sw0:0;
 if(szG)szG.gain.setTargetAtTime(cooking?.05:0,AC.currentTime,.2);
 if(sel){ring.position.set(sel.g.position.x,(sel.fl?3.3:.1),sel.g.position.z);
  if(sel.sit&&sel.act!='walk'){const s=S[sel.k];ring.position.y=FY[s.fl]+.05}
  ring.scale.setScalar(1+Math.sin(t*4)*.1)}
 clouds.forEach(c=>{c.position.x+=dt*.8;if(c.position.x>90)c.position.x=-90});
 const pulse=.5+.3*Math.sin(t*3);TVs.emissiveIntensity=pulse+.3;
 oc.update();R.render(scene,cam)}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
frame();
</script></body></html>
